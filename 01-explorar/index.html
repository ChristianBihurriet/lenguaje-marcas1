<!doctype html>
<!-- El elemento html contiene todo el documento e indica su idioma. -->
<html lang="es">
  <!-- head guarda información para el navegador que no forma parte del contenido visible. -->
  <head>
    <!-- UTF-8 permite mostrar correctamente tildes, eñes y otros caracteres. -->
    <meta charset="UTF-8">
    <!-- title es el texto que aparece en la pestaña del navegador. -->
    <title>La página de Lucía</title>
  </head>
  <!-- body contiene todo lo que se muestra dentro de la página. -->
  <body>
    <!-- h1 es el encabezado principal. -->
    <h1>Hola, soy Lucía</h1>

    <p>Estudio primero de DAM y hoy estoy explorando mi primera página HTML.</p>

    <!-- h2 introduce una sección dentro de la página. -->
    <h2>Lo que quiero aprender</h2>

    <!-- ul crea una lista; cada elemento de la lista se escribe con li. -->
    <ul>
      <li>Crear páginas web sencillas</li>
      <li>Organizar información</li>
      <li>Entender cómo funciona la web</li>
    </ul>

    <h2>Mi primer cambio</h2>
    <p>Voy a editar este archivo, guardarlo y recargar el navegador.</p>
  </body>
</html>
